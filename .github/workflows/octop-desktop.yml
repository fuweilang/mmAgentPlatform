name: Octop Desktop Package

# 跑在 mmAgentPlatform 仓库根。Octop 源码在 Octop/。
# 用法：Actions → Octop Desktop Package → Run workflow
#   platforms: darwin-arm64,darwin-amd64,windows-amd64
# 产物在 run 的 Artifacts，改名后传到宝塔 /www/mammoth/downloads/：
#   猛犸智能体-desktop-darwin-arm64-*.dmg  → mammoth-agent-mac-arm64.dmg
#   猛犸智能体-desktop-darwin-amd64-*.dmg  → mammoth-agent-mac-x64.dmg
#   猛犸智能体-desktop-windows-amd64-*.exe → mammoth-agent-win.exe
# 不要 push 到 TencentCloud/Octop。

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated plats, or 'all'"
        required: true
        default: "darwin-arm64,darwin-amd64,windows-amd64"
        type: string
      attach_release:
        description: "Upload artifacts to a GitHub Release (need release_tag)"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "GitHub Release tag (e.g. v0.9.31)"
        required: false
        default: ""
        type: string
      attach_from_run:
        description: "Existing workflow run ID — attach artifacts, skip rebuild"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    green-portable-${{
      github.event.inputs.attach_from_run != '' && 'attach' || 'build'
    }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event.inputs.attach_from_run == '' }}

env:
  PBS_BASE_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20251209
  PBS_TAG: "20251209"
  PBS_PY: "3.12.12"

jobs:
  frontend:
    name: Build dashboard
    if: github.event.inputs.attach_from_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Octop/dashboard/package-lock.json

      - name: Build frontend → src/octop/dashboard
        working-directory: Octop
        env:
          VITE_BASE: /
        run: make build-frontend

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: Octop/src/octop/dashboard/
          if-no-files-found: error
          retention-days: 7

  select-platforms:
    name: Select platforms
    if: github.event.inputs.attach_from_run == ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'darwin-arm64,darwin-amd64,windows-amd64' }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os

          all_plats = [
              {"plat": "linux-amd64", "arch": "amd64", "os": "ubuntu-latest"},
              {"plat": "linux-arm64", "arch": "arm64", "os": "ubuntu-24.04-arm"},
              {"plat": "darwin-arm64", "arch": "arm64", "os": "macos-14"},
              {"plat": "darwin-amd64", "arch": "amd64", "os": "macos-15-intel"},
              {"plat": "windows-amd64", "arch": "amd64", "os": "windows-latest"},
              {"plat": "windows-arm64", "arch": "arm64", "os": "windows-11-arm"},
          ]
          sel = os.environ.get("PLATFORMS", "all").lower().replace(" ", "")
          known = {row["plat"] for row in all_plats}
          if sel == "all":
              include = all_plats
          else:
              wanted = {part for part in sel.split(",") if part}
              unknown = wanted - known
              if unknown:
                  raise SystemExit(f"unknown platform(s): {', '.join(sorted(unknown))}")
              include = [row for row in all_plats if row["plat"] in wanted]
          if not include:
              raise SystemExit(f"no platforms selected: {sel}")
          matrix = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={matrix}\n")
          print(matrix)
          PY

  package:
    name: "${{ matrix.plat }}"
    needs: [frontend, select-platforms]
    runs-on: ${{ matrix.os }}
    env:
      GREEN_HOST_PLAT: ${{ matrix.plat }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: Octop
    steps:
      - uses: actions/checkout@v5

      - name: Read package version
        run: |
          set -euo pipefail
          VER=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pyproject.toml | head -1)
          echo "OCTOP_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "version=${VER}"

      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: Octop/src/octop/dashboard

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Cache python-build-standalone downloads
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: Octop/desktop/portable/.cache
          key: pbs-${{ env.PBS_TAG }}-${{ env.PBS_PY }}-${{ matrix.plat }}

      - name: Bootstrap portable CPython
        env:
          GREEN_HOST_PLAT: ${{ matrix.plat }}
        run: bash desktop/portable/bootstrap-runtime.sh "${{ matrix.plat }}"

      - name: Assemble green zip
        env:
          GREEN_HOST_PLAT: ${{ matrix.plat }}
        run: |
          set -euo pipefail
          echo "GREEN_HOST_PLAT=${GREEN_HOST_PLAT} RUNNER_ARCH=${RUNNER_ARCH:-} uname=$(uname -ms)"
          bash desktop/portable/package.sh "${{ matrix.plat }}"

      - name: Smoke import (native host only)
        run: |
          set -euo pipefail
          staging="desktop/portable/release/Octop-${{ matrix.plat }}"
          if [[ -x "${staging}/runtime/bin/python3" ]]; then
            py="${staging}/runtime/bin/python3"
          elif [[ -f "${staging}/runtime/python.exe" ]]; then
            py="${staging}/runtime/python.exe"
          else
            echo "python missing under ${staging}/runtime" >&2
            exit 1
          fi
          req_file="desktop/portable/requirements-${{ matrix.plat }}.txt"
          if [[ ! -f "$req_file" ]]; then
            echo "frozen requirements missing: ${req_file}" >&2
            exit 1
          fi
          verify_args=(
            --packages "${staging}/packages"
            --requirements "$req_file"
          )
          override_file="desktop/portable/overrides-${{ matrix.plat }}.txt"
          if [[ -f "$override_file" ]]; then
            verify_args+=(--overrides "$override_file")
          fi
          PYTHONNOUSERSITE=1 \
            "$py" desktop/portable/verify_imports.py \
              "${verify_args[@]}"
          if [[ "${{ matrix.plat }}" == darwin-* ]]; then
            REPO_ROOT="$PWD"
            source desktop/portable/_common.sh
            verify_no_homebrew_dylibs "${staging}/packages" "${{ matrix.plat }}"
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: Octop/desktop/src/go.sum

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.13

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          $makensis = Join-Path $nsisDir "makensis.exe"
          function Test-Makensis { Test-Path -LiteralPath $makensis }

          if (-not (Test-Makensis)) {
            $installed = $false
            for ($i = 1; $i -le 5; $i++) {
              Write-Host "choco install nsis (attempt $i/5)"
              try {
                choco install nsis --yes --no-progress --execution-timeout=600
              } catch {
                Write-Warning "choco attempt $i failed: $_"
              }
              if (Test-Makensis) { $installed = $true; break }
              Start-Sleep -Seconds ([Math]::Min(60, 10 * $i))
            }

            if (-not $installed) {
              Write-Host "Chocolatey unavailable; downloading NSIS setup from SourceForge"
              $setup = Join-Path $env:RUNNER_TEMP "nsis-setup.exe"
              $urls = @(
                "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11-setup.exe",
                "https://sourceforge.net/projects/nsis/files/NSIS%203/3.11/nsis-3.11-setup.exe/download"
              )
              $downloaded = $false
              foreach ($url in $urls) {
                try {
                  Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing -TimeoutSec 180
                  if ((Test-Path -LiteralPath $setup) -and ((Get-Item $setup).Length -gt 1MB)) {
                    $downloaded = $true
                    break
                  }
                } catch {
                  Write-Warning "NSIS download failed from $url : $_"
                }
              }
              if (-not $downloaded) {
                throw "NSIS install failed (Chocolatey and direct download)"
              }
              Start-Process -FilePath $setup -ArgumentList "/S" -Wait
            }
          }

          if (-not (Test-Makensis)) {
            throw "makensis.exe missing after NSIS install"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir

      - name: Package desktop app with bundled portable runtime
        working-directory: Octop/desktop/src
        run: >-
          wails3 task package
          ARCH=${{ matrix.arch }}
          VERSION=${{ env.OCTOP_VERSION }}
          PORTABLE_ZIP=../portable/release/Octop-portable-${{ matrix.plat }}-${{ env.OCTOP_VERSION }}.zip

      - uses: actions/upload-artifact@v7
        with:
          path: Octop/desktop/portable/release/Octop-portable-${{ matrix.plat }}-${{ env.OCTOP_VERSION }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload bundled desktop package
        uses: actions/upload-artifact@v7
        with:
          path: Octop/desktop/src/bin/*-desktop-${{ matrix.plat }}-${{ env.OCTOP_VERSION }}.*
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach zips to GitHub Release
    needs: package
    if: >-
      always() &&
      !cancelled() &&
      (needs.package.result == 'success' || needs.package.result == 'skipped') &&
      github.event.inputs.attach_release == 'true' &&
      github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve release tag
        id: rel
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          if [[ "$tag" != v* ]]; then
            echo "Need a v* tag." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: Octop-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.attach_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
