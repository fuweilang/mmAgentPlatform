services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: mammoth-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: mammoth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mammoth_core
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mammoth -d mammoth_core"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mammoth

  api:
    image: mammoth-api:local
    build:
      context: ./src
      dockerfile: infra/baota/Dockerfile.api
    container_name: mammoth-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mammoth:${POSTGRES_PASSWORD}@pg:5432/mammoth_core
      PORT: "3100"
      PUBLIC_ORIGIN: https://www.mmai.vip
      OIDC_ISSUER: https://www.mmai.vip/console/api/oidc
      OIDC_CLIENT_ID: mammoth-octop
      COOKIE_NAME: mammothai_access_token
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./data/uploads:/app/apps/backend/uploads
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - mammoth

  octop:
    image: mammoth-octop:local
    build:
      context: ./Octop
      dockerfile: Dockerfile.octop
    container_name: mammoth-octop
    restart: unless-stopped
    env_file: .env
    environment:
      HOME: /data
      OCTOP_BIND_HOST: 0.0.0.0
      OCTOP_PORT: "8088"
      OCTOP_LOG_LEVEL: info
      OCTOP_ADMIN_USERNAME: ${OCTOP_ADMIN_USERNAME:-admin}
      OCTOP_DEFAULT_PASSWORD: ${OCTOP_DEFAULT_PASSWORD}
      OCTOP_ADMIN_DISPLAY_NAME: Admin
      # 覆盖数据卷里可能留下的本机 issuer。本地 pnpm dev:octop 不设这个变量。
      OCTOP_MAMMOTH_OIDC_ISSUER: https://www.mmai.vip/console/api/oidc
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./data/octop:/data/.octop
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - mammoth

volumes:
  pgdata:

networks:
  mammoth:
    name: mammoth
