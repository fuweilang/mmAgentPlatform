# 猛犸智能体路径。挂在 www.mmai.vip server 内，不改 / /system /workbench /v2。
# 由 extension include 加载。

# 桌面客户端安装包。文件放到 /www/mammoth/downloads/：
#   mammoth-agent-mac-arm64.dmg
#   mammoth-agent-mac-x64.dmg
#   mammoth-agent-win.exe
# 不要再用 mammoth-agent.dmg（线上曾误放成 PeecAI 协同工作台）。
location = /downloads/mammoth-agent.dmg {
    return 302 /downloads/mammoth-agent-mac-arm64.dmg;
}
location = /downloads/mammoth-agent-x86_64.dmg {
    return 302 /downloads/mammoth-agent-mac-x64.dmg;
}
location = /downloads/mammoth-agent.exe {
    return 302 /downloads/mammoth-agent-win.exe;
}
location ^~ /downloads/mammoth-agent {
    alias /www/mammoth/downloads/mammoth-agent;
    default_type application/octet-stream;
    add_header Content-Disposition "attachment";
    # no-cache = 用前先问服务器；文件没变回 304，覆盖上传后下新包。
    etag on;
    expires off;
    add_header Cache-Control "no-cache";
}

location = /mengma-logo.png { alias /www/mammoth/web/mengma-logo.png; }
location = /logo-icon.png { alias /www/mammoth/web/logo-icon.png; }
location = /favicon.png { alias /www/mammoth/web/favicon.png; }

location ^~ /assets/ {
    root /www/mammoth/web;
    expires 7d;
    access_log off;
}

location = /login {
    root /www/mammoth/web;
    try_files /index.html =404;
}
location ^~ /login/ {
    root /www/mammoth/web;
    try_files /index.html =404;
}

location = /console { return 301 /console/; }
location = /console/login { return 302 /login; }
location ^~ /console/login/ { return 302 /login; }
location ^~ /console/api/ {
    proxy_pass http://127.0.0.1:3100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-mammoth-public-api /console/api;
    proxy_read_timeout 120s;
    client_max_body_size 50m;
}
location ^~ /console/ {
    root /www/mammoth/web;
    try_files /index.html =404;
}

location = /admin { return 301 /admin/; }
location ^~ /admin/api/ {
    proxy_pass http://127.0.0.1:3100/api/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 50m;
}
location ^~ /admin/ {
    root /www/mammoth/web;
    try_files /index.html =404;
}

location = /middle { return 301 /console/; }
location ^~ /middle/login { return 302 /login; }
location ^~ /middle/api/ {
    proxy_pass http://127.0.0.1:3100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-mammoth-public-api /middle/api;
    proxy_read_timeout 120s;
    client_max_body_size 50m;
}
location ^~ /middle/ { return 301 /console/; }

location = /agent { return 301 /agent/chat; }
location ^~ /agent/ {
    proxy_pass http://127.0.0.1:8088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 50m;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8088/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 50m;
}

location ^~ /socket.io {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
}
